name: agent-checks

# Tool-neutral merge gate. Whether code was written by Claude Code, Codex, or a
# human, it must pass the same `make check` here before it can land.
on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install frontend dependencies
        if: ${{ hashFiles('package-lock.json') != '' }}
        run: npm ci
      - name: Build frontend for editable install
        if: ${{ hashFiles('package-lock.json') != '' }}
        run: npm run build
      - name: Install product development dependencies
        if: ${{ hashFiles('pyproject.toml') != '' }}
        run: python -m pip install -e ".[dev]"
      - name: Run shared agent checks
        run: make check
