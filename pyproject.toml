[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "flowsight"
version = "0.1.0a0"
description = "Local runtime visualization map for Python FastAPI developers"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi==0.139.0",
  "platformdirs==4.10.0",
  "pydantic==2.13.4",
  "starlette==1.3.1",
  "uvicorn==0.51.0",
]

[project.optional-dependencies]
dev = [
  "asgiref==3.11.1",
  "build==1.5.1",
  "mypy==2.2.0",
  "opentelemetry-api==1.43.0",
  "opentelemetry-instrumentation-fastapi==0.64b0",
  "opentelemetry-sdk==1.43.0",
  "pytest==9.1.1",
  "ruff==0.15.21",
  "wrapt==2.2.2",
]

[tool.setuptools.packages.find]
include = ["flowsight*"]

[tool.setuptools.package-data]
flowsight = ["py.typed", "static/index.html", "static/assets/*"]

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers"]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["flowsight", "spikes/sidecar_otel", "spikes/tracepoint_backend"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
